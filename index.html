<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Camera - PMD Sirampog </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .gps-pulse {
            animation: pulse-ring 2s infinite ease-in-out;
        }
        /* Placeholder saat kamera mati */
        .cam-off-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: repeating-linear-gradient(45deg, #0f172a, #0f172a 10px, #1e293b 10px, #1e293b 20px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 md:p-8">

    <!-- Header -->
    <header class="w-full max-w-md flex items-center justify-between mb-4">
        <div class="flex items-center space-x-2">
            <div class="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-500/30">
                <i data-lucide="camera" class="w-6 h-6 text-white"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">GeoCam Studio</h1>
        </div>
        <div id="status-badge" class="flex items-center space-x-2 bg-slate-900/80 border border-slate-800 px-3 py-1 rounded-full text-xs font-medium backdrop-blur-md">
            <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping" id="status-dot"></span>
            <span id="status-text" class="text-slate-300">Mencari GPS...</span>
        </div>
    </header>

    <!-- Main Viewport -->
    <main class="w-full max-w-md flex flex-col items-center flex-grow justify-center relative">
        <div class="relative w-full aspect-[3/4] bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border border-slate-800/80 group">
            
            <!-- Video Stream -->
            <video id="camera-feed" autoplay playsinline muted class="w-full h-full object-cover"></video>

            <!-- Placeholder saat kamera mati -->
            <div id="cam-off-overlay" class="absolute inset-0 cam-off-placeholder hidden z-10">
                <i data-lucide="video-off" class="w-16 h-16 text-slate-600 mb-3"></i>
                <p class="text-slate-400 text-sm font-medium">Kamera Nonaktif</p>
                <p class="text-slate-500 text-xs mt-1">Tekan tombol kamera untuk mengaktifkan</p>
            </div>

            <canvas id="capture-canvas" class="hidden"></canvas>

            <!-- Watermark GPS Overlay -->
            <div class="absolute bottom-4 left-4 right-4 bg-slate-950/60 backdrop-blur-md border border-white/10 p-4 rounded-2xl shadow-lg text-xs space-y-2 transition-all duration-300 z-20">
                <div class="flex items-start justify-between">
                    <div>
                        <div class="flex items-center space-x-1.5 text-indigo-400 font-semibold mb-0.5">
                            <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                            <span id="loc-address">Memuat Alamat...</span>
                        </div>
                        <p class="text-slate-400 text-[10px]" id="loc-coords">Lat: 0.0000, Long: 0.0000</p>
                    </div>
                    <div class="text-right">
                        <span id="watermark-time" class="text-white font-medium block">--:--:--</span>
                        <span id="watermark-date" class="text-slate-400 text-[10px]">-----</span>
                    </div>
                </div>
                <div class="pt-2 border-t border-white/10 flex items-center justify-between text-[10px] text-slate-400">
                    <span class="flex items-center gap-1"><i data-lucide="compass" class="w-3 h-3 text-cyan-400"></i> Akurasi: <span id="loc-acc">-</span></span>
                    <span class="flex items-center gap-1"><i data-lucide="smartphone" class="w-3 h-3 text-indigo-400"></i> GeoCam JS</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Control Bar -->
    <footer class="w-full max-w-md mt-6 flex items-center justify-around">
        <!-- Tombol Switch Kamera -->
        <button id="btn-switch" class="p-4 rounded-full bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:bg-slate-800 transition shadow-lg">
            <i data-lucide="switch-camera" class="w-5 h-5"></i>
        </button>

        <!-- Tombol On/Off Kamera -->
        <button id="btn-toggle-cam" class="p-4 rounded-full bg-slate-900 border border-slate-800 text-rose-400 hover:text-white hover:bg-rose-600 transition shadow-lg" title="Matikan Kamera">
            <i data-lucide="power" class="w-5 h-5" id="toggle-icon"></i>
        </button>

        <!-- Tombol Shutter -->
        <button id="btn-capture" class="relative group p-1 rounded-full focus:outline-none">
            <div class="absolute -inset-1 rounded-full bg-gradient-to-r from-indigo-500 to-cyan-500 opacity-75 group-hover:opacity-100 blur transition duration-300 gps-pulse"></div>
            <div class="relative w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-xl transform active:scale-95 transition">
                <div class="w-14 h-14 border-2 border-slate-900 rounded-full flex items-center justify-center bg-slate-900">
                    <div class="w-10 h-10 bg-white rounded-full group-hover:bg-indigo-50 transition"></div>
                </div>
            </div>
        </button>

        <!-- Tombol Gallery -->
        <button id="btn-gallery" class="p-4 rounded-full bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:bg-slate-800 transition shadow-lg relative">
            <i data-lucide="image" class="w-5 h-5"></i>
            <span id="gallery-badge" class="absolute -top-1 -right-1 w-5 h-5 bg-indigo-600 rounded-full text-[10px] font-bold flex items-center justify-center text-white hidden">0</span>
        </button>
    </footer>

    <!-- Modal Hasil Foto -->
    <div id="result-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xl z-50 flex flex-col items-center justify-center p-4 hidden">
        <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-4 shadow-2xl flex flex-col items-center space-y-4">
            <div class="w-full flex items-center justify-between">
                <h3 class="font-bold text-sm text-slate-200">Foto Berhasil Diambil</h3>
                <button id="close-modal" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="w-full aspect-[3/4] rounded-2xl overflow-hidden border border-slate-800">
                <img id="result-img" class="w-full h-full object-cover" alt="Hasil Foto GPS">
            </div>
            <div class="w-full flex space-x-3">
                <a id="download-btn" download="geocam-photo.png" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl text-center text-sm transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                    <i data-lucide="download" class="w-4 h-4"></i> Simpan Foto
                </a>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const video = document.getElementById('camera-feed');
        const canvas = document.getElementById('capture-canvas');
        const btnCapture = document.getElementById('btn-capture');
        const btnSwitch = document.getElementById('btn-switch');
        const btnToggleCam = document.getElementById('btn-toggle-cam');
        const toggleIcon = document.getElementById('toggle-icon');
        const camOffOverlay = document.getElementById('cam-off-overlay');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const statusBadge = document.getElementById('status-badge');

        const locCoords = document.getElementById('loc-coords');
        const locAddress = document.getElementById('loc-address');
        const locAcc = document.getElementById('loc-acc');
        const watermarkTime = document.getElementById('watermark-time');
        const watermarkDate = document.getElementById('watermark-date');

        const resultModal = document.getElementById('result-modal');
        const resultImg = document.getElementById('result-img');
        const downloadBtn = document.getElementById('download-btn');
        const closeModal = document.getElementById('close-modal');

        let currentStream = null;
        let useFrontCamera = false;
        let cameraOn = false; // Status kamera
        let currentLatitude = 0;
        let currentLongitude = 0;
        let currentAccuracy = 0;
        let currentAddressName = "Lokasi terdeteksi";

        // Polyfill roundRect untuk browser lama
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

        // 1. Live Jam & Tanggal
        function updateDateTime() {
            const now = new Date();
            watermarkTime.textContent = now.toLocaleTimeString('id-ID');
            watermarkDate.textContent = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // 2. Update UI status kamera
        function updateCameraUI() {
            if (cameraOn) {
                camOffOverlay.classList.add('hidden');
                toggleIcon.setAttribute('data-lucide', 'power');
                btnToggleCam.classList.remove('bg-emerald-600', 'text-white', 'hover:bg-emerald-500');
                btnToggleCam.classList.add('text-rose-400');
                btnToggleCam.title = "Matikan Kamera";
            } else {
                camOffOverlay.classList.remove('hidden');
                toggleIcon.setAttribute('data-lucide', 'power');
                btnToggleCam.classList.remove('text-rose-400');
                btnToggleCam.classList.add('bg-emerald-600', 'text-white', 'hover:bg-emerald-500');
                btnToggleCam.title = "Nyalakan Kamera";
            }
            lucide.createIcons();
        }

        // 3. Akses Kamera
        async function initCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }

            const constraints = {
                video: {
                    facingMode: useFrontCamera ? 'user' : 'environment',
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                cameraOn = true;
                updateCameraUI();
            } catch (err) {
                console.error("Gagal mengakses kamera: ", err);
                cameraOn = false;
                updateCameraUI();
                alert("Tidak dapat mengakses kamera. Pastikan izin diberikan.");
            }
        }

        // 4. Matikan Kamera
        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            video.srcObject = null;
            cameraOn = false;
            updateCameraUI();
        }

        // 5. Toggle On/Off Kamera
        btnToggleCam.addEventListener('click', () => {
            if (cameraOn) {
                stopCamera();
            } else {
                initCamera();
            }
        });

        // 6. GPS & Reverse Geocoding
        function initGPS() {
            if (!navigator.geolocation) {
                statusText.textContent = "GPS tidak didukung browser";
                return;
            }

            navigator.geolocation.watchPosition(
                async (position) => {
                    currentLatitude = position.coords.latitude;
                    currentLongitude = position.coords.longitude;
                    currentAccuracy = Math.round(position.coords.accuracy);

                    locCoords.textContent = `Lat: ${currentLatitude.toFixed(5)}, Long: ${currentLongitude.toFixed(5)}`;
                    locAcc.textContent = `${currentAccuracy} m`;

                    statusDot.className = "w-2 h-2 rounded-full bg-emerald-500";
                    statusText.textContent = "GPS Terkunci";
                    statusBadge.classList.add("border-emerald-500/30");

                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLatitude}&lon=${currentLongitude}`);
                        const data = await response.json();
                        if (data && data.display_name) {
                            const parts = data.display_name.split(',');
                            currentAddressName = `${parts[0]}, ${parts[1] || ''}`.trim();
                            locAddress.textContent = currentAddressName;
                        }
                    } catch (e) {
                        locAddress.textContent = "Lokasi GPS Aktif";
                    }
                },
                (error) => {
                    console.error("Gagal mendapatkan GPS:", error);
                    statusDot.className = "w-2 h-2 rounded-full bg-rose-500";
                    statusText.textContent = "GPS Gagal / Mati";
                    locAddress.textContent = "Gagal memuat lokasi";
                },
                { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }
            );
        }

        // 7. Capture Foto
        btnCapture.addEventListener('click', () => {
            if (!cameraOn || !currentStream) {
                alert("Kamera sedang nonaktif. Nyalakan kamera terlebih dahulu.");
                return;
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const padding = 40;
            const boxHeight = 160;
            const boxY = canvas.height - boxHeight - padding;

            ctx.fillStyle = "rgba(15, 23, 42, 0.75)";
            ctx.roundRect(padding, boxY, canvas.width - (padding * 2), boxHeight, 20);
            ctx.fill();

            // Watermark kiri: alamat & koordinat
            ctx.fillStyle = "#818cf8";
            ctx.font = "bold 24px Inter, sans-serif";
            ctx.fillText(currentAddressName, padding + 30, boxY + 45);

            ctx.fillStyle = "#94a3b8";
            ctx.font = "20px Inter, sans-serif";
            ctx.fillText(`Lat: ${currentLatitude.toFixed(5)}, Long: ${currentLongitude.toFixed(5)}`, padding + 30, boxY + 80);

            // Watermark kanan: jam & tanggal
            const timeText = watermarkTime.textContent;
            const dateText = watermarkDate.textContent;

            ctx.textAlign = "right";
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 22px Inter, sans-serif";
            ctx.fillText(timeText, canvas.width - padding - 30, boxY + 50);

            ctx.fillStyle = "#94a3b8";
            ctx.font = "18px Inter, sans-serif";
            ctx.fillText(dateText, canvas.width - padding - 30, boxY + 80);
            ctx.textAlign = "left";

            const dataURL = canvas.toDataURL('image/png');
            resultImg.src = dataURL;
            downloadBtn.href = dataURL;
            resultModal.classList.remove('hidden');
        });

        // 8. Switch Kamera
        btnSwitch.addEventListener('click', () => {
            if (!cameraOn) {
                alert("Nyalakan kamera terlebih dahulu.");
                return;
            }
            useFrontCamera = !useFrontCamera;
            initCamera();
        });

        closeModal.addEventListener('click', () => {
            resultModal.classList.add('hidden');
        });

        // 9. Inisialisasi awal
        window.addEventListener('load', () => {
            initCamera();
            initGPS();
        });
    </script>
</body>
</html>
